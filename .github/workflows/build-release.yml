name: Build WinIsland

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/WinIsland/WinIsland.csproj
            tests/WinIsland.Tests/WinIsland.Tests.csproj

      - name: Restore
        run: dotnet restore .\WinIsland.sln

      - name: Build
        run: dotnet build .\WinIsland.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\tests\WinIsland.Tests\WinIsland.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          dotnet publish .\src\WinIsland\WinIsland.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output .\artifacts\publish

          Copy-Item .\Install.ps1 .\artifacts\publish\Install.ps1
          Copy-Item .\Uninstall.ps1 .\artifacts\publish\Uninstall.ps1
          Copy-Item .\Install.bat .\artifacts\publish\Install.bat
          Copy-Item .\LICENSE .\artifacts\publish\LICENSE.txt
          @('WinIsland for Windows 11', '', 'Extract the complete ZIP, then run Install.bat.', 'The installer does not need administrator permission.') | Set-Content .\artifacts\publish\INSTALL.txt

          Compress-Archive -Path .\artifacts\publish\* `
            -DestinationPath .\artifacts\WinIsland-win-x64.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WinIsland-win-x64
          path: artifacts/WinIsland-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: WinIsland-win-x64
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINISLAND_REF: ${{ github.ref }}
          WINISLAND_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$WINISLAND_REF" == "refs/heads/main" ]]; then
            VERSION="v$(grep -oP '(?<=<Version>)[^<]+' src/WinIsland/WinIsland.csproj | head -n 1)"
            TARGET_ARGS=(--target "$WINISLAND_SHA")
          else
            VERSION="${WINISLAND_REF#refs/tags/}"
            TARGET_ARGS=()
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving the published release unchanged."
            exit 0
          fi

          gh release create "$VERSION" artifacts/WinIsland-win-x64.zip \
            --title "WinIsland $VERSION" \
            --generate-notes \
            "${TARGET_ARGS[@]}"
